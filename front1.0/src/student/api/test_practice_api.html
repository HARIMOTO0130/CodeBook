<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试练习题API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .question {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .question-header {
            font-weight: bold;
            margin-bottom: 10px;
        }
        .question-content {
            margin-bottom: 10px;
            color: #333;
        }
        .options {
            margin-left: 20px;
        }
        .option {
            margin-bottom: 5px;
        }
        .code {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 3px;
            margin-top: 10px;
        }
        .error {
            color: red;
            font-weight: bold;
        }
        .success {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>测试练习题API</h1>
        <div id="result"></div>
    </div>

    <script>
        // API基础URL
        const API_BASE_URL = 'http://localhost:8000';
        
        // 测试章节ID
        const TEST_CHAPTER_ID = 1;
        
        // 测试函数
        async function testPracticeAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="success">正在请求API...</div>';
            
            try {
                // 发起请求
                const response = await fetch(`${API_BASE_URL}/books/chapters/${TEST_CHAPTER_ID}/practice/`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                });
                
                // 检查响应状态
                if (!response.ok) {
                    throw new Error(`HTTP错误！状态：${response.status}`);
                }
                
                // 解析响应数据
                const data = await response.json();
                
                // 显示完整响应
                resultDiv.innerHTML = `
                    <div class="success">API请求成功！</div>
                    <h2>完整响应数据</h2>
                    <pre class="code">${JSON.stringify(data, null, 2)}</pre>
                    <h2>练习题信息</h2>
                    <p><strong>标题:</strong> ${data.title}</p>
                    <p><strong>描述:</strong> ${data.description || '无描述'}</p>
                    <p><strong>问题数量:</strong> ${data.questions.length}</p>
                    <h2>问题列表</h2>
                `;
                
                // 显示每个问题
                data.questions.forEach((question, index) => {
                    const questionDiv = document.createElement('div');
                    questionDiv.className = 'question';
                    
                    let questionContent = '';
                    
                    // 问题内容
                    questionContent += `<div class="question-header">问题 ${index + 1} (${question.type}):</div>`;
                    questionContent += `<div class="question-content">${question.content}</div>`;
                    
                    // 选择题选项
                    if (question.type === 'choice' && question.choice_options) {
                        questionContent += '<div class="options">';
                        question.options.forEach((option, optionIndex) => {
                            questionContent += `<div class="option">${String.fromCharCode(65 + optionIndex)}. ${option.content}</div>`;
                        });
                        questionContent += '</div>';
                    }
                    
                    // 填空题
                    if (question.type === 'fill' && question.fill_blanks) {
                        questionContent += '<div class="options">';
                        question.fill_blanks.forEach(blank => {
                            questionContent += `<div class="option">${blank.prompt}</div>`;
                        });
                        questionContent += '</div>';
                    }
                    
                    questionDiv.innerHTML = questionContent;
                    resultDiv.appendChild(questionDiv);
                });
                
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">API请求失败: ${error.message}</div>`;
                console.error('API请求失败:', error);
            }
        }
        
        // 页面加载时执行测试
        window.onload = testPracticeAPI;
    </script>
</body>
</html>
